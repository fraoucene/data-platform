[project]
name = "data-platform"
version = "0.1.0"
requires-python = ">=3.12"
dependencies = [
    "bodacc-client",
    "dp-common",
]

[tool.uv.workspace]
members = ["packages/*", "lambdas/*", "jobs/*"]
# jobs/conftest.py (fixture `spark`) fait écrire jobs/__pycache__ par pytest : sans cette exclusion, le glob
# jobs/* le prend pour un membre et uv échoue (« missing a pyproject.toml »).
exclude = ["jobs/__pycache__"]

[tool.uv.sources]
dp-common = { workspace = true }
bodacc-client = { workspace = true }

[dependency-groups]
dev = [
    "chispa>=0.12.0",
    "moto[s3]>=5.2.4",
    "pre-commit>=4.7.0",
    "pyspark==3.5.8",
    "pytest>=9.1.1",
    "pytest-cov>=7.1.0",
    "respx>=0.23.1",
    "ruff>=0.17.1",
]

[tool.ruff]
line-length = 120
target-version = "py312"
src = ["packages/*/src", "lambdas/*/src", "jobs/*/src"]
# Scripts de génération des schémas Excalidraw : outillage de documentation, hors lint.
# learning/ : supports de cours ; les exemples alignent leurs commentaires `# →` pour la lecture mobile.
extend-exclude = ["docs/**/*_gen.py", "learning/**"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.pytest.ini_options]
testpaths = ["packages", "lambdas", "jobs", "infra/scripts"]
addopts = "-q --import-mode=importlib -m 'not integration'"
markers = ["integration: appelle la vraie API BODACC (lent, réseau) ; lancer avec make test-integration"]
