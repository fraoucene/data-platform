[project]
name = "bodacc-client"
version = "0.1.0"
description = "Client Python de l'API BODACC : export JSONL en streaming, retries, modèle Pydantic"
readme = "README.md"
authors = [
    { name = "Fraoucene GUEZOUT", email = "fraoucene.guezout@gmail.com" }
]
requires-python = ">=3.12"
dependencies = [
    "httpx>=0.28.1",
    "pydantic>=2.14.1",
]

[build-system]
requires = ["uv_build>=0.9.28,<0.10.0"]
build-backend = "uv_build"
